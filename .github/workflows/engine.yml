name: engine

# Builds the Lokinet engine (liblokinet-android.so) from the upstream stable
# tag with our patches, and publishes it as a release asset for the app build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine.yml"

permissions:
  contents: write

env:
  LOKINET_TAG: v0.9.15
  ENGINE_TAG: engine-0.9.15-jmc1
  ABIS: arm64-v8a
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  so:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        timeout-minutes: 8
        run: |
          # usually preinstalled on the runner; apt only if something is missing (it hung once)
          missing=""
          # unbound regenerates its config parser; byacc output breaks it, it needs real bison
          for t in autoconf automake libtoolize pkg-config autopoint bison flex; do command -v $t >/dev/null || missing="$missing $t"; done
          echo "missing:${missing:- none}"
          if [ -n "$missing" ]; then
            timeout 300 sudo apt-get install -y -qq --no-install-recommends autoconf automake libtool pkg-config autopoint gettext bison flex > /dev/null
          fi
          bison --version | head -1
          cmake --version | head -1

      - name: Get Lokinet ${{ env.LOKINET_TAG }}
        run: |
          git clone --branch "$LOKINET_TAG" --depth 1 https://github.com/oxen-io/lokinet.git lokinet
          cd lokinet
          # the gui submodule is an electron app we don't need
          git -c submodule.gui.update=none -c submodule.external/pybind11.update=none \
              -c submodule.test/Catch2.update=none \
              submodule update --init --recursive --depth 1 --jobs 4
          for p in ../engine/patches/*.patch; do echo "apply $p"; git apply --verbose "$p"; done

      - name: NDK
        run: |
          # NDK r27c (clang 18, libc++ 18). r25 lacks <source_location>; r28+ (libc++ 19)
          # drops std::char_traits<unsigned char>; r30 clang trips fmt 10.1 consteval.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "using $NDK"; cat "$NDK/source.properties" | grep Revision
          # the static-deps build still asks for old binutils names; NDK r23+ only ships llvm tools
          cd "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in aarch64-linux-android arm-linux-androideabi armv7a-linux-androideabi x86_64-linux-android i686-linux-android; do
            [ -e "$t-ar" ] || ln -s llvm-ar "$t-ar"
            [ -e "$t-ranlib" ] || ln -s llvm-ranlib "$t-ranlib"
            [ -e "$t-ld" ] || ln -s ld.lld "$t-ld"
            [ -e "$t-strip" ] || ln -s llvm-strip "$t-strip"
            [ -e "$t-nm" ] || ln -s llvm-nm "$t-nm"
          done

      - name: Build engine
        run: |
          cd lokinet
          set -o pipefail
          JOBS=$(nproc) ./contrib/android.sh \
            "-DOPENSSL_MIRROR=https://github.com/openssl/openssl/releases/download/openssl-3.0.7;https://www.openssl.org/source/old/3.0" \
            "-DZLIB_MIRROR=https://zlib.net/fossils;https://github.com/madler/zlib/releases/download/v1.2.13" \
            "-DCURL_MIRROR=https://curl.se/download;https://curl.se/download/archeology" \
            2>&1 | tee ../build.log
          ls -la build-android/out/*/

      - name: Check engine
        run: |
          so=lokinet/build-android/out/arm64-v8a/liblokinet-android.so
          file "$so"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$so" | grep -c Java_network_loki_lokinet_
          grep -a -c "ignored on android" "$so"
          cp "$so" liblokinet-android-arm64-v8a.so

      - name: Publish engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$ENGINE_TAG" --yes --cleanup-tag || true
          gh release create "$ENGINE_TAG" liblokinet-android-arm64-v8a.so \
            --title "Engine $ENGINE_TAG" \
            --notes "Lokinet $LOKINET_TAG + engine/patches. Used by the app build." \
            --prerelease

      - name: Save failure log
        if: failure()
        run: |
          [ -f build.log ] || echo "failed before build" > build.log
          grep -n -i -E "error|fail|not found|No such" build.log | tail -n 80 > /tmp/fail.log || true
          echo "=================== tail" >> /tmp/fail.log
          tail -n 250 build.log >> /tmp/fail.log
          git config user.name "AM.JMC"
          git config user.email "272643218+Amirmahdavi2022@users.noreply.github.com"
          git fetch -q origin ci-logs || true
          git checkout -q -B ci-logs origin/ci-logs 2>/dev/null || git checkout -q --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/fail.log "engine-${{ github.run_number }}.log"
          git add -f "engine-${{ github.run_number }}.log"
          git commit -qm "engine log ${{ github.run_number }}"
          git push -q origin HEAD:ci-logs
