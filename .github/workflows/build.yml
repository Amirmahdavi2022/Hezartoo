name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "engine/**"
      - ".github/workflows/engine.yml"
      - "README.md"
      - "brand/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  ENGINE_TAG: engine-0.9.15-jmc1
  VERSION_NAME: 0.1.${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Get engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          gh release download "$ENGINE_TAG" --pattern 'liblokinet-android-arm64-v8a.so' \
            --output app/src/main/jniLibs/arm64-v8a/liblokinet-android.so --clobber
          # refuse to ship an engine without our patch inside
          grep -a -c "ignored on android" app/src/main/jniLibs/arm64-v8a/liblokinet-android.so

      - name: Keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: debug APK only."
          fi

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          [ -n "$KEYSTORE_FILE" ] || unset KEYSTORE_FILE
          task=assembleDebug; [ -n "$KEYSTORE_FILE" ] && task=assembleRelease
          set -o pipefail
          gradle ":app:$task" -PappVersionCode=${{ github.run_number }} -PappVersionName="$VERSION_NAME" \
            --stacktrace 2>&1 | tee build.log

      - name: Check JNI names match the engine
        run: |
          set -e
          so=app/src/main/jniLibs/arm64-v8a/liblokinet-android.so
          NM="$(ls -d $ANDROID_NDK_LATEST_HOME 2>/dev/null || echo $ANDROID_NDK_HOME)/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only "$so" | grep -o 'Java_network_loki_lokinet_[A-Za-z]*_[A-Za-z]*' | sort -u > /tmp/c.txt
          cat /tmp/c.txt
          for cls in LokinetDaemon LokinetConfig; do
            f=$(find app/build/intermediates -path "*network/loki/lokinet/$cls.class" | head -1)
            javap -p "$f" | grep ' native ' | sed -E 's/.* ([A-Za-z]+)\(.*/\1/' | while read -r m; do
              grep -qx "Java_network_loki_lokinet_${cls}_$m" /tmp/c.txt || { echo "MISSING in engine: $cls.$m"; exit 1; }
            done
          done
          echo "all native methods present"

      - name: Check APK
        run: |
          set -e
          apk=$(ls app/build/outputs/apk/*/*.apk | head -1)
          unzip -l "$apk" | grep "lib/arm64-v8a/liblokinet-android.so"
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$apk" | head -3
          mkdir -p out
          cp "$apk" "out/hezartoo-$VERSION_NAME-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: hezartoo-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name == 'push' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION_NAME"
          gh release create "$tag" out/*.apk --target "$GITHUB_SHA" \
            --title "Hezartoo $VERSION_NAME" \
            --notes "Probe build for arm64 phones. Turn every other VPN off, connect, wait 2-3 minutes, then tap the exit test." \
            --prerelease

      - name: Save failure log
        if: failure()
        run: |
          [ -f build.log ] || echo "failed before gradle" > build.log
          tail -n 250 build.log > /tmp/fail.log
          git config user.name "AM.JMC"
          git config user.email "272643218+Amirmahdavi2022@users.noreply.github.com"
          git fetch -q origin ci-logs || true
          git checkout -q -B ci-logs origin/ci-logs 2>/dev/null || git checkout -q --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/fail.log "build-${{ github.run_number }}.log"
          git add -f "build-${{ github.run_number }}.log"
          git commit -qm "log ${{ github.run_number }}"
          git push -q origin HEAD:ci-logs
